plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// We compile both Java and Kotlin from the same 'src' tree (Starsector convention).
sourceSets.main.java.srcDirs = ['src']
sourceSets.main.kotlin.srcDirs = ['src']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')

    // Library mods we depend on
    compileOnly fileTree(dir: "${starsectorPath}/mods/LazyLib-3.0.0/jars", include: '*.jar')

    // Console Commands is a SOFT dependency: data/console/commands.csv is only read when the console
    // mod is active, so our command class is never loaded (and never NoClassDefFoundErrors) without it.
    compileOnly fileTree(dir: "${starsectorPath}/mods/Console Commands-4.0.9/jars", include: '*.jar')

    // Kotlin runtime is provided AT RUNTIME by LazyLib (jars/internal/Kotlin-Runtime.jar) on
    // Starsector's shared classloader, so we compile against it but must NOT bundle our own copy.
    // kotlin.stdlib.default.dependency=false (in gradle.properties) prevents the plugin from adding one.
    compileOnly files("${starsectorPath}/mods/LazyLib-3.0.0/jars/internal/Kotlin-Runtime.jar")
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'StarterPack.jar'
    // Do not embed the Kotlin stdlib -- LazyLib provides it. This keeps the jar small and
    // avoids classloader conflicts with other Kotlin mods.
}

/**
 * Refuses to build a jar that touches java.io or reflection, anywhere.
 *
 * Starsector loads mod classes through a loader that rejects those outright -- "File access and
 * reflection are not allowed to scripts" -- and it does so at *class resolution* time, so the failure
 * lands wherever the class happens to be reached: at startup if a Janino-compiled mission names it,
 * or mid-click if the UI does. Both have already happened here. Mods read and write only through
 * Global.getSettings().readTextFileFromCommon and friends, which reach saves/common and nothing else.
 *
 * The scan is deliberately whole-jar rather than aimed at one class: the first version of this guard
 * checked only the mission's entry point, and the very next release crashed on a button press instead.
 *
 * The vendored uiframework is exempt -- it reflects on purpose, that is its entire job, and it has
 * shipped in three of the author's mods without tripping the loader. It resolves the game's own
 * classes through ReflectionUtils, which the loader permits.
 */
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    def classesDir = layout.buildDirectory.dir('classes/kotlin/main')
    def banned = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
    def exemptPackages = ['starterpack/uiframework/']
    inputs.dir(classesDir)
    outputs.upToDateWhen { false }
    doLast {
        def root = classesDir.get().asFile
        if (!root.isDirectory()) {
            throw new GradleException("checkNoForbiddenApis: ${root} not found -- have the outputs moved?")
        }
        def offenders = [:]
        root.eachFileRecurse { file ->
            if (!file.name.endsWith('.class')) return
            def rel = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (exemptPackages.any { rel.startsWith(it) }) return
            // Class names live as plain text in the constant pool, so a byte scan needs no ASM. It
            // over-approximates -- a banned name anywhere in the pool trips it -- which is the safe
            // direction for a guard whose failure mode is a fatal dialog box.
            def text = new String(file.readBytes(), 'ISO-8859-1')
            def hits = banned.findAll { text.contains(it) }
            if (hits) offenders[rel] = hits
        }
        if (offenders) {
            def detail = offenders.collect { k, v -> "  ${k}: ${v.join(', ')}" }.join('\n')
            throw new GradleException(
                "Forbidden APIs in mod classes -- Starsector's classloader refuses these and the " +
                "game will die with \"File access and reflection are not allowed to scripts\":\n" +
                detail + "\n" +
                "Use Global.getSettings().readTextFileFromCommon / writeTextFileToCommon instead; " +
                "they are the only file access mods are given, and they reach saves/common only.")
        }
    }
}

tasks.named('jar') { dependsOn 'checkNoForbiddenApis' }
