plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// We compile both Java and Kotlin from the same 'src' tree (Starsector convention).
sourceSets.main.java.srcDirs = ['src']
sourceSets.main.kotlin.srcDirs = ['src']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')

    // Library mods we depend on
    compileOnly fileTree(dir: "${starsectorPath}/mods/LazyLib-3.0.0/jars", include: '*.jar')

    // Console Commands is a SOFT dependency: data/console/commands.csv is only read when the console
    // mod is active, so our command class is never loaded (and never NoClassDefFoundErrors) without it.
    compileOnly fileTree(dir: "${starsectorPath}/mods/Console Commands-4.0.9/jars", include: '*.jar')

    // Kotlin runtime is provided AT RUNTIME by LazyLib (jars/internal/Kotlin-Runtime.jar) on
    // Starsector's shared classloader, so we compile against it but must NOT bundle our own copy.
    // kotlin.stdlib.default.dependency=false (in gradle.properties) prevents the plugin from adding one.
    compileOnly files("${starsectorPath}/mods/LazyLib-3.0.0/jars/internal/Kotlin-Runtime.jar")
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'StarterPack.jar'
    // Do not embed the Kotlin stdlib -- LazyLib provides it. This keeps the jar small and
    // avoids classloader conflicts with other Kotlin mods.
}

/**
 * Guards the one class that Janino has to resolve.
 *
 * data/missions/starterpack_bench/MissionDefinition.java is compiled at runtime by Starsector's
 * script compiler, which loads classes through a loader that refuses java.io and java.lang.reflect
 * outright: "File access and reflection are not allowed to scripts". Resolving the script's single
 * call makes Janino ask LoadoutBench for its declared members, forcing the JVM to load every type in
 * every one of its signatures -- so one innocuous helper returning a File there crashes the game on
 * startup, before the main menu, with a stack trace that names Janino rather than the helper.
 *
 * That is far too quiet a trap to leave to a comment, so the build refuses to produce a jar that
 * would spring it.
 */
tasks.register('checkScriptFacade') {
    dependsOn tasks.named('classes')
    def classFile = layout.buildDirectory.file('classes/kotlin/main/starterpack/bench/LoadoutBench.class')
    def bannedPrefixes = ['java/io/', 'java/nio/', 'java/lang/reflect/']
    inputs.file(classFile)
    outputs.upToDateWhen { false }
    doLast {
        def target = classFile.get().asFile
        if (!target.exists()) {
            throw new GradleException("checkScriptFacade: ${target} not found -- has the class moved?")
        }
        // Descriptors live as plain UTF-8 in the constant pool, so a byte scan is enough here and
        // needs no ASM dependency. It over-approximates (a banned name anywhere trips it), which is
        // the safe direction for a guard whose failure mode is an unbootable game.
        def bytes = new String(target.readBytes(), 'ISO-8859-1')
        def found = bannedPrefixes.findAll { bytes.contains(it) }
        if (found) {
            throw new GradleException(
                "LoadoutBench references ${found.join(', ')} -- Starsector's script classloader " +
                "refuses those, and the refit bench mission will fail to compile at game startup. " +
                "Move that code to BenchFiles (or any class the mission does not name).")
        }
    }
}

tasks.named('jar') { dependsOn 'checkScriptFacade' }
